<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>區域立法委員 - 2024 選舉 - Open Voter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f9fafb;
        }
        .hero-gradient {
            background: linear-gradient(135deg, #1a56db 0%, #3b82f6 50%, #60a5fa 100%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(26, 86, 219, 0.15);
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/open_voter/" class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg hero-gradient flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-900">Open Voter</h1>
                        <p class="text-xs text-gray-500">台灣選舉政見履約追蹤</p>
                    </div>
                </a>
            </div>
            <nav class="hidden md:flex items-center gap-6">
                <a href="/open_voter/" class="text-sm text-gray-600 hover:text-blue-600 transition-colors">首頁</a>
                <a href="/open_voter/pages/2024.html" class="text-sm text-gray-600 hover:text-blue-600 transition-colors">2024 選舉</a>
            </nav>
        </div>
    </header>

    <!-- Breadcrumb -->
    <div class="bg-gray-50 border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 py-3">
            <nav class="flex items-center gap-2 text-sm">
                <a href="/open_voter/" class="text-gray-500 hover:text-blue-600 transition-colors">首頁</a>
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
                <a href="/open_voter/pages/2024.html" class="text-gray-500 hover:text-blue-600 transition-colors">2024</a>
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
                <span class="text-gray-900 font-medium">區域立法委員</span>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 py-12 md:py-16">
        <div class="max-w-6xl mx-auto px-4">
            <div class="text-center mb-12">
                <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">區域立法委員</h2>
                <p class="text-lg text-gray-500">第十一屆立法委員選舉 - 區域候選人</p>
            </div>

            <!-- Filter -->
            <div class="mb-8 flex flex-wrap gap-4 justify-center">
                <select id="region-filter" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 bg-white">
                    <option value="">全部縣市</option>
                    <option value="台北市">台北市</option>
                    <option value="新北市">新北市</option>
                    <option value="桃園市">桃園市</option>
                    <option value="台中市">台中市</option>
                    <option value="台南市">台南市</option>
                    <option value="高雄市">高雄市</option>
                </select>
            </div>

            <!-- Candidates Container -->
            <div id="candidates-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Loading State -->
                <div class="col-span-full text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                    <p class="mt-4 text-gray-500">載入候選人資料中...</p>
                </div>
            </div>

            <div class="text-center mt-12">
                <a href="/open_voter/pages/2024.html" class="inline-flex items-center gap-2 text-gray-600 hover:text-blue-600 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    <span>返回 2024 選舉</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-8">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg hero-gradient flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                        </svg>
                    </div>
                    <span class="font-medium text-white">Open Voter</span>
                </div>
                <p class="text-sm">© 2024 Open Voter. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        const partyColors = {
            '民主進步黨': { bg: 'bg-green-100', text: 'text-green-700', border: 'border-green-500' },
            '中國國民黨': { bg: 'bg-blue-100', text: 'text-blue-700', border: 'border-blue-500' },
            '台灣民眾黨': { bg: 'bg-orange-100', text: 'text-orange-700', border: 'border-orange-500' },
            '時代力量': { bg: 'bg-yellow-100', text: 'text-yellow-700', border: 'border-yellow-500' },
            '台灣基進': { bg: 'bg-red-100', text: 'text-red-700', border: 'border-red-500' }
        };

        const districtCandidates = [
            { 姓名: '王世堅', 黨籍: '民主進步黨', 選區: '台北市', 狀態: '當選', 政見: [{ 標題: '推动公共交通优化', 說明: '改善台北市公車路線與服務品質', KPI狀態: '進行中' }] },
            { 姓名: '羅智強', 黨籍: '中國國民黨', 選區: '台北市', 狀態: '落選', 政見: [{ 標題: '強化監督政府', 說明: '加強國會監督職能', KPI狀態: '待追蹤' }] },
            { 姓名: '黃國昌', 黨籍: '台灣民眾黨', 選區: '新北市', 狀態: '當選', 政見: [{ 標題: '司法改革', 說明: '推動公平正義司法制度', KPI狀態: '進行中' }] },
            { 姓名: '江啟臣', 黨籍: '中國國民黨', 選區: '台中市', 狀態: '當選', 政見: [{ 標題: '中部發展', 說明: '促進中部產業與交通建設', KPI狀態: '進行中' }] },
            { 姓名: '林俊憲', 黨籍: '民主進步黨', 選區: '台南市', 狀態: '當選', 政見: [{ 標題: '文化建設', 說明: '推動台南文化古都活化', KPI狀態: '已完成' }] },
            { 姓名: '陳其邁', 黨籍: '民主進步黨', 選區: '高雄市', 狀態: '當選', 政見: [{ 標題: '產業升級', 說明: '推動高雄產業轉型與科技發展', KPI狀態: '進行中' }] },
            { 姓名: '張嘉郡', 黨籍: '中國國民黨', 選區: '雲林縣', 狀態: '當選', 政見: [{ 標題: '農業發展', 說明: '支持農業現代化與農民福利', KPI狀態: '進行中' }] },
            { 姓名: '徐巧芯', 黨籍: '中國國民黨', 選區: '台北市', 狀態: '當選', 政見: [{ 標題: '居住正義', 說明: '關注青年購屋與租屋問題', KPI狀態: '待追蹤' }] }
        ];

        function renderCandidates(candidates) {
            const container = document.getElementById('candidates-container');
            
            if (candidates.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500"><p>目前無符合條件的候選人</p></div>';
                return;
            }

            container.innerHTML = candidates.map(candidate => {
                const partyInfo = partyColors[candidate['黨籍']] || { bg: 'bg-gray-100', text: 'text-gray-700', border: 'border-gray-500' };
                const statusClass = candidate['狀態'] === '當選' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-700';
                
                return `
                    <div class="card-hover bg-white rounded-xl shadow-md overflow-hidden">
                        <div class="p-6">
                            <div class="flex items-center gap-4 mb-4">
                                <div class="w-14 h-14 rounded-full ${partyInfo.bg} flex items-center justify-center">
                                    <span class="${partyInfo.text} text-xl font-bold">${candidate['姓名'][0]}</span>
                                </div>
                                <div>
                                    <h3 class="text-lg font-semibold text-gray-900">${candidate['姓名']}</h3>
                                    <p class="text-sm ${partyInfo.text}">${candidate['黨籍']}</p>
                                    <p class="text-xs text-gray-500">${candidate['選區']}</p>
                                </div>
                            </div>
                            
                            <div class="flex items-center justify-between mb-4">
                                <span class="inline-block px-2 py-1 rounded text-xs font-medium ${statusClass}">
                                    ${candidate['狀態']}
                                </span>
                            </div>
                            
                            <div class="border-t border-gray-100 pt-4">
                                <p class="text-sm text-gray-600">${candidate['政見'][0]['標題']}</p>
                                <p class="text-xs text-gray-400 mt-1">${candidate['政見'][0]['說明']}</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function init() {
            renderCandidates(districtCandidates);
            
            document.getElementById('region-filter').addEventListener('change', function(e) {
                const region = e.target.value;
                if (region) {
                    const filtered = districtCandidates.filter(c => c['選區'] === region);
                    renderCandidates(filtered);
                } else {
                    renderCandidates(districtCandidates);
                }
            });
        }

        init();
    </script>
</body>
</html>
