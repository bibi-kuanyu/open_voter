<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賴清德 - 2024 總統候選人 - Open Voter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f9fafb;
        }
        .hero-gradient {
            background: linear-gradient(135deg, #1a56db 0%, #3b82f6 50%, #60a5fa 100%);
        }
        .party-dpp {
            background: linear-gradient(135deg, #28a745 0%, #34c759 100%);
        }
        .status-completed { background-color: #d1fae5; color: #065f46; }
        .status-in-progress { background-color: #dbeafe; color: #1e40af; }
        .status-pending { background-color: #f3f4f6; color: #374151; }
        .status-failed { background-color: #fee2e2; color: #991b1b; }
        .status-party-continued { background-color: #dbeafe; color: #1e40af; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/open_voter/" class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg hero-gradient flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-900">Open Voter</h1>
                        <p class="text-xs text-gray-500">台灣選舉政見履約追蹤</p>
                    </div>
                </a>
            </div>
            <nav class="hidden md:flex items-center gap-6">
                <a href="/open_voter/" class="text-sm text-gray-600 hover:text-blue-600 transition-colors">首頁</a>
                <a href="/open_voter/pages/2024.html" class="text-sm text-gray-600 hover:text-blue-600 transition-colors">2024 選舉</a>
            </nav>
        </div>
    </header>

    <!-- Breadcrumb -->
    <div class="bg-gray-50 border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 py-3">
            <nav class="flex items-center gap-2 text-sm">
                <a href="/open_voter/" class="text-gray-500 hover:text-blue-600 transition-colors">首頁</a>
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
                <a href="/open_voter/pages/2024.html" class="text-gray-500 hover:text-blue-600 transition-colors">2024</a>
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
                <a href="/open_voter/pages/2024/president.html" class="text-gray-500 hover:text-blue-600 transition-colors">總統候選人</a>
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
                <span class="text-gray-900 font-medium">賴清德</span>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 py-12 md:py-16">
        <div class="max-w-4xl mx-auto px-4">
            <!-- Candidate Header -->
            <div class="bg-white rounded-xl shadow-md p-8 mb-8">
                <div class="flex flex-col md:flex-row items-center gap-6">
                    <div class="w-32 h-32 rounded-full party-dpp flex items-center justify-center flex-shrink-0">
                        <span class="text-white text-5xl font-bold">賴</span>
                    </div>
                    <div class="text-center md:text-left">
                        <div class="inline-block bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-medium mb-2">
                            當選
                        </div>
                        <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2">賴清德</h1>
                        <p class="text-xl text-green-700 font-medium mb-1">民主進步黨</p>
                        <p class="text-gray-500">副手：蕭美琴</p>
                    </div>
                </div>
            </div>

            <!-- Policies Section -->
            <div class="bg-white rounded-xl shadow-md p-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">政見與履約狀態</h2>
                
                <div id="policies-progress" class="mb-6"></div>
                
                <div id="policies-container" class="space-y-6">
                    <!-- Loading State -->
                    <div class="text-center py-8">
                        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-green-600"></div>
                        <p class="mt-4 text-gray-500">載入政見資料中...</p>
                    </div>
                </div>
            </div>

            <!-- Back Button -->
            <div class="mt-8 text-center">
                <a href="/open_voter/pages/2024/president.html" class="inline-flex items-center gap-2 text-gray-600 hover:text-blue-600 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    <span>返回總統候選人列表</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-8">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg hero-gradient flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                        </svg>
                    </div>
                    <span class="font-medium text-white">Open Voter</span>
                </div>
                <p class="text-sm">© 2024 Open Voter. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        const statusLabels = {
            '已完成': { text: '已完成', class: 'status-completed', icon: '✅' },
            '進行中': { text: '進行中', class: 'status-in-progress', icon: '🔵' },
            '待追蹤': { text: '待追蹤', class: 'status-pending', icon: '⚪' },
            '未達成': { text: '未達成', class: 'status-failed', icon: '❌' },
            '政黨延續': { text: '政黨延續', class: 'status-in-progress', icon: '🔄' }
        };

        async function loadPolicies() {
            try {
                const response = await fetch('/open_voter/data/candidates.json');
                const data = await response.json();
                const candidate = data['2024']['總統大選']['候選人'].find(c => c['姓名'] === '賴清德');
                const container = document.getElementById('policies-container');
                
                if (!candidate) {
                    container.innerHTML = '<p class="text-gray-500">找不到候選人資料</p>';
                    return;
                }

                const policyCount = candidate['政見'].length;
                const completedCount = candidate['政見'].filter(p => p['KPI狀態'] === '已完成').length;
                const progress = Math.round((completedCount / policyCount) * 100);
                
                const progressColor = progress === 100 ? 'bg-green-500' : progress >= 50 ? 'bg-blue-500' : progress > 0 ? 'bg-yellow-500' : 'bg-red-500';
                
                document.getElementById('policies-progress').innerHTML = `
                    <div class="bg-gray-50 rounded-lg p-4">
                        <div class="flex justify-between text-sm mb-2">
                            <span class="font-medium text-gray-700">政見達成率</span>
                            <span class="text-gray-600">${completedCount}/${policyCount} 已完成</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-3">
                            <div class="${progressColor} h-3 rounded-full" style="width: ${progress}%"></div>
                        </div>
                    </div>
                `;
                
                container.innerHTML = candidate['政見'].map(policy => {
                    const status = statusLabels[policy['KPI狀態']] || statusLabels['待追蹤'];
                    return `
                        <div class="border border-gray-200 rounded-lg p-6">
                            <div class="flex items-start justify-between mb-4">
                                <div>
                                    <h3 class="text-lg font-semibold text-gray-900">${policy['標題']}</h3>
                                    <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-sm font-medium ${status.class}">
                                        <span>${status.icon}</span>
                                        <span>${status.text}</span>
                                    </span>
                                </div>
                            </div>
                            <p class="text-gray-600 mb-2">${policy['說明']}</p>
                            <div class="flex flex-wrap gap-2 text-sm text-gray-500">
                                ${policy['政見來源'] ? `<span class="bg-gray-100 px-2 py-1 rounded">${policy['政見來源']}</span>` : ''}
                                ${policy['延續追蹤'] ? `<span class="bg-gray-100 px-2 py-1 rounded">${policy['延續追蹤']}</span>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading policies:', error);
                document.getElementById('policies-container').innerHTML = 
                    '<p class="text-gray-500 text-center py-8">載入政見資料失敗， 請稍後再試。</p>';
            }
        }

        loadPolicies();
    </script>
</body>
</html>
