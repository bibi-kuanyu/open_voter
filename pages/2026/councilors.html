<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 縣市議員候選人追蹤 - Open Voter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f9fafb; }
        .hero-gradient { background: linear-gradient(135deg, #1a56db 0%, #3b82f6 50%, #60a5fa 100%); }
    </style>
</head>
<body class="text-gray-800">
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/open_voter/" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded hero-gradient flex items-center justify-center text-white font-bold text-xs">OV</div>
                <span class="font-bold text-xl">Open Voter</span>
            </a>
            <nav class="flex gap-4 text-sm font-medium">
                <a href="/open_voter/pages/index.html" class="text-gray-600 hover:text-blue-600">2026 專題</a>
                <a href="/open_voter/" class="text-gray-600 hover:text-blue-600">回首頁</a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-20 text-center">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-8">
            <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
        <h1 class="text-4xl font-bold text-gray-900 mb-6">縣市議員資料籌備中</h1>
        <p class="text-xl text-gray-600 mb-10 leading-relaxed">
            2026 年縣市議員選舉登記將於 2026 年 8 月底開始。<br>
            我們目前正密集收集各政黨初選及潛在參選人資訊，將於近期上線選區查詢功能。
        </p>
        <div class="inline-flex items-center gap-2 bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors cursor-pointer shadow-lg shadow-blue-200">
            <span>通知我最新進度</span>
        </div>
        <div class="mt-20 grid grid-cols-1 md:grid-cols-3 gap-6 text-left">
            <div class="p-6 bg-white rounded-xl border border-gray-100">
                <h3 class="font-bold mb-2">全台選區涵蓋</h3>
                <p class="text-sm text-gray-500">提供 22 縣市所有選區的候選人政見追蹤。</p>
            </div>
            <div class="p-6 bg-white rounded-xl border border-gray-100">
                <h3 class="font-bold mb-2">政見履約對比</h3>
                <p class="text-sm text-gray-500">當選後我們將追蹤其政見在議會的提案與執行狀況。</p>
            </div>
            <div class="p-6 bg-white rounded-xl border border-gray-100">
                <h3 class="font-bold mb-2">公民監督討論</h3>
                <p class="text-sm text-gray-500">整合公開數據與在地回饋，讓監督更有力。</p>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-12 mt-20">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-sm">© 2024 Open Voter. 公民參與，讓選舉更透明。</p>
        </div>
    </footer>
</body>
</html>
