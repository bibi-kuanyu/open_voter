<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柯文哲 履歷檔案 - Open Voter</title>
    <meta name="description" content="柯文哲政治履歷與歷屆政見履約追蹤。">
    <meta name="robots" content="index, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background: #f9fafb; color: #1f2937; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: #6b7280; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 2rem; margin-bottom: 1.5rem; }
        .header { display: flex; gap: 2rem; align-items: center; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #f97316, #ea580c); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .avatar span { color: white; font-size: 2.5rem; font-weight: bold; }
        .info h1 { font-size: 1.8rem; font-weight: 700; }
        .party-tag { display: inline-block; background: #ffedd5; color: #c2410c; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.85rem; font-weight: 500; margin-top: 0.5rem; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-top: 1.5rem; }
        .stat { background: white; border-radius: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 1.25rem; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 700; }
        .stat-label { font-size: 0.8rem; color: #6b7280; margin-top: 0.25rem; }
        .election { border-left: 4px solid #e5e7eb; padding-left: 1.25rem; margin-bottom: 1.5rem; position: relative; }
        .election::before { content: ''; position: absolute; left: -10px; top: 0.25rem; width: 16px; height: 16px; border-radius: 50%; background: #2563eb; border: 3px solid white; box-shadow: 0 0 0 2px #2563eb; }
        .election.won::before { background: #22c55e; box-shadow: 0 0 0 2px #22c55e; }
        .election.lost::before { background: #ef4444; box-shadow: 0 0 0 2px #ef4444; }
        .election-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .election-year { font-size: 1.1rem; font-weight: 600; }
        .election-result { font-size: 0.8rem; padding: 0.2rem 0.6rem; border-radius: 999px; font-weight: 500; }
        .result-won { background: #dcfce7; color: #166534; }
        .result-lost { background: #fee2e2; color: #991b1b; }
        .election-detail { color: #6b7280; font-size: 0.9rem; }
        .election-pledges { font-size: 0.85rem; color: #374151; margin-top: 0.5rem; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #e5e7eb; }
        .footer { text-align: center; padding: 2rem; color: #9ca3af; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/open_voter/pages/persons.html" class="back-link">← 返回人物總覽</a>

        <div class="card">
            <div class="header">
                <div class="avatar"><span>柯</span></div>
                <div class="info">
                    <h1>柯文哲</h1>
                    <div class="party-tag">台灣民眾黨</div>
                </div>
            </div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-value" style="color:#2563eb">2</div>
                    <div class="stat-label">歷屆選舉</div>
                </div>
                <div class="stat">
                    <div class="stat-value" style="color:#2563eb">22</div>
                    <div class="stat-label">總政見數</div>
                </div>
                <div class="stat">
                    <div class="stat-value" style="color:#22c55e">7</div>
                    <div class="stat-label">已完成</div>
                </div>
                <div class="stat">
                    <div class="stat-value" style="color:#6b7280">32%</div>
                    <div class="stat-label">平均達成率</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="section-title">📅 選舉時間軸</h2>

            <div class="election lost">
                <div class="election-header">
                    <span class="election-year">2024 總統大選</span>
                    <span class="election-result result-lost">未當選</span>
                </div>
                <div class="election-detail">副手：吳欣盈｜得票率：26.46%</div>
                <div class="election-pledges">政見數：10｜達成：0｜進行中：4</div>
                <a href="/open_voter/pages/2024/president_ko.html">📋 查看政見履約追蹤 →</a>
            </div>

            <div class="election won">
                <div class="election-header">
                    <span class="election-year">2018 台北市長</span>
                    <span class="election-result result-won">當選</span>
                </div>
                <div class="election-pledges">政見數：12｜已完成：7</div>
            </div>
        </div>

        <div class="footer">
            <p>資料來源：Open Voter 台灣選舉政見履約追蹤</p>
        </div>
    </div>
</body>
</html>
