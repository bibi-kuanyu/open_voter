<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="2024年台灣選舉專題，涵蓋總統候選人及立法委員選舉，提供候選人政見履約追蹤，協助選民了解候選人承諾的兌現情形。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background: #f9fafb; color: #1f2937; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: #6b7280; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 1.5rem; margin-bottom: 1rem; }
        .page-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; }
        .page-subtitle { color: #6b7280; margin-bottom: 2rem; }
        .candidate-row { display: flex; align-items: center; gap: 1.5rem; padding: 1rem 0; border-bottom: 1px solid #e5e7eb; }
        .candidate-row:last-child { border-bottom: none; }
        .candidate-info { flex: 0 0 200px; }
        .candidate-name { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.25rem; }
        .candidate-party { font-size: 0.8rem; color: #6b7280; }
        .candidate-chart { flex: 1; }
        .chart-bar { height: 24px; background: #e5e7eb; border-radius: 12px; overflow: hidden; position: relative; }
        .chart-fill { height: 100%; border-radius: 12px; transition: width 0.3s; }
        .chart-fill.high { background: linear-gradient(90deg, #22c55e, #16a34a); }
        .chart-fill.medium { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .chart-fill.low { background: linear-gradient(90deg, #ef4444, #dc2626); }
        .chart-label { font-size: 0.85rem; color: #374151; margin-top: 0.5rem; }
        .chart-stats { flex: 0 0 120px; text-align: right; }
        .stats-value { font-size: 1.5rem; font-weight: 700; color: #2563eb; }
        .stats-label { font-size: 0.75rem; color: #9ca3af; }
        .election-type { font-size: 0.75rem; color: #2563eb; background: #dbeafe; padding: 0.2rem 0.6rem; border-radius: 999px; font-weight: 500; margin-left: 0.5rem; }
        .footer { text-align: center; padding: 2rem; color: #9ca3af; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/open_voter/" class="back-link">← 返回首頁</a>

        <div class="card">

            <!-- 賴清德 -->
            <a href="/open_voter/pages/persons/lai_ching-te.html" class="candidate-row" style="display:flex; text-decoration: none; color: inherit;">

                </div>
                <div class="candidate-chart">
                    <div class="chart-bar">
                        <div class="chart-fill medium" style="width: 58%;"></div>
                    </div>
                    <div class="chart-label">歷年平均達成率</div>
                </div>
                <div class="chart-stats">
                    <div class="stats-value">58%</div>
                    <div class="stats-label">平均達成率</div>
                </div>
            </a>

                    <div class="candidate-party">中國國民黨｜副手：趙少康</div>
                </div>
                <div class="candidate-chart">
                    <div class="chart-bar">

                </div>

            <!-- 柯文哲 -->
            <a href="/open_voter/pages/persons/ko_wen-je.html" class="candidate-row" style="display:flex; text-decoration: none; color: inherit;">
                <div class="candidate-info">
                    <div class="candidate-name">柯文哲<span class="election-type" style="background:#fee2e2; color:#991b1b;">未當選</span></div>
                    <div class="candidate-party">台灣民眾黨｜副手：吳欣盈</div>
                </div>
                <div class="candidate-chart">
                    <div class="chart-bar">
                        <div class="chart-fill low" style="width: 32%;"></div>
                    </div>
                    <div class="chart-label">歷年平均達成率</div>
                </div>
                <div class="chart-stats">
                    <div class="stats-value">32%</div>
                    <div class="stats-label">平均達成率</div>
                </div>
            </a>
        </div>

        <!-- 立委區域 -->

            <h2 class="page-title" style="font-size: 1.3rem; margin-bottom: 1rem;">立法委員候選人</h2>
            <a href="/open_voter/pages/2024/legislators_district.html" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: #f9fafb; border-radius: 0.5rem; text-decoration: none; color: inherit;">
                <div>
                    <div style="font-weight: 600; color: #1f2937;">區域立法委員</div>
                    <div style="font-size: 0.85rem; color: #6b7280;">73個選區候選人</div>
                </div>
                <div style="color: #2563eb;">查看 →</div>
            </a>
            <a href="/open_voter/pages/2024/legislators_party.html" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: #f9fafb; border-radius: 0.5rem; text-decoration: none; color: inherit; margin-top: 0.5rem;">
                <div>
                    <div style="font-weight: 600; color: #1f2937;">不分區立法委員</div>

                <div style="color: #2563eb;">查看 →</div>

        </div>
    </div>

    <div class="footer">
        <p>資料來源：Open Voter 台灣選舉政見履約追蹤</p>
