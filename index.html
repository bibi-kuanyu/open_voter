<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Voter - 台灣選舉政見履約追蹤平台</title>
    <meta name="description" content="Open Voter 提供台灣選舉政見履約追蹤，涵蓋2024總統、立委候選人政見與實際執行進度對照，協助選民了解候選人承諾的兌現情形。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background: #f9fafb; color: #1f2937; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .page-title { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .page-subtitle { color: #6b7280; margin-bottom: 2rem; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 1.5rem; margin-bottom: 1rem; }
        .year-badge { display: inline-block; font-size: 1.5rem; font-weight: 700; color: #2563eb; margin-right: 1rem; }
        .year-info { font-size: 0.85rem; color: #6b7280; }
        .year-card { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; border-radius: 1rem; margin-bottom: 1rem; transition: transform 0.2s, box-shadow 0.2s; }
        .year-card:last-child { margin-bottom: 0; }
        .year-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        .year-card-content { display: flex; align-items: center; gap: 1.5rem; }
        .year-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-center; font-weight: 700; color: white; font-size: 1.1rem; }
        .icon-2024 { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .icon-2026 { background: linear-gradient(135deg, #16a34a, #15803d); }
        .icon-2028 { background: linear-gradient(135deg, #6b7280, #4b5563); }
        .year-name { font-size: 1.25rem; font-weight: 600; }
        .year-type { font-size: 0.8rem; color: #6b7280; margin-top: 0.2rem; }
        .year-arrow { color: #9ca3af; font-size: 1.2rem; }
        .status-tag { font-size: 0.7rem; padding: 0.25rem 0.6rem; border-radius: 999px; font-weight: 500; margin-left: 0.75rem; }
        .status-completed { background: #dcfce7; color: #166534; }
        .status-upcoming { background: #fef3c7; color: #92400e; }
        .status-planning { background: #f3f4f6; color: #6b7280; }
        .footer { text-align: center; padding: 2rem; color: #9ca3af; font-size: 0.85rem; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="page-title">Open Voter</h1>
            <p class="page-subtitle">台灣選舉政見履約追蹤平台</p>

            <!-- 2024 -->
            <a href="/open_voter/pages/2024.html" class="year-card" style="background: white; text-decoration: none; color: inherit; border: 1px solid #e5e7eb;">
                <div class="year-card-content">
                    <div class="year-icon icon-2024">24</div>
                    <div>
                        <div class="year-name">2024 選舉<span class="status-tag status-completed">已完成</span></div>
                        <div class="year-type">總統、副總統及立法委員選舉</div>
                    </div>
                </div>
                <div class="year-arrow">→</div>
            </a>

            <!-- 2026 -->
            <a href="/open_voter/pages/index.html" class="year-card" style="background: white; text-decoration: none; color: inherit; border: 1px solid #e5e7eb;">
                <div class="year-card-content">
                    <div class="year-icon icon-2026">26</div>
                    <div>
                        <div class="year-name">2026 選舉<span class="status-tag status-upcoming">即將到來</span></div>
                        <div class="year-type">縣市首長及地方議會選舉</div>
                    </div>
                </div>
                <div class="year-arrow">→</div>
            </a>

            <!-- 2028 -->
            <div class="year-card" style="background: #f9fafb; border: 1px solid #e5e7eb; cursor: default;">
                <div class="year-card-content">
                    <div class="year-icon icon-2028">28</div>
                    <div>
                        <div class="year-name" style="color: #9ca3af;">2028 選舉<span class="status-tag status-planning">規劃中</span></div>
                        <div class="year-type" style="color: #d1d5db;">下一屆總統大選</div>
                    </div>
                </div>
                <div class="year-arrow" style="color: #d1d5db;">—</div>
            </div>
        </div>

        <div class="footer">
            <p>資料來源：Open Voter 台灣選舉政見履約追蹤</p>
        </div>
    </div>
</body>
</html>
